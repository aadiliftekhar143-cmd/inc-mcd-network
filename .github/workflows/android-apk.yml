# Optional: builds the APK on GitHub. Add repo secrets WS_API_URL and WS_ANON_KEY,
# Runs on every push to main that changes android/ or this file.
# then Actions > Build APK > Run workflow. Download the APK from the run's Artifacts.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Read app version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build Release APK
        env:
          WS_API_URL: ${{ secrets.WS_API_URL }}
          WS_ANON_KEY: ${{ secrets.WS_ANON_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
        run: |
          ARGS=""
          if [ -n "$WS_API_URL" ]; then ARGS="$ARGS -PWS_API_URL=$WS_API_URL -PWS_ANON_KEY=$WS_ANON_KEY"; fi
          if [ -n "$FCM_APP_ID" ]; then ARGS="$ARGS -PFCM_APP_ID=$FCM_APP_ID -PFCM_API_KEY=$FCM_API_KEY -PFCM_PROJECT_ID=$FCM_PROJECT_ID -PFCM_SENDER_ID=$FCM_SENDER_ID"; fi
          gradle assembleRelease $ARGS
      - uses: actions/upload-artifact@v4
        with: { name: ward-sadasya-apk, path: android/app/build/outputs/apk/release/*.apk }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "INC MCD NETWORK v${{ steps.ver.outputs.name }}"
          make_latest: true
          body: |
            ### INC MCD NETWORK v${{ steps.ver.outputs.name }} (Build ${{ steps.ver.outputs.code }})
            - एक ही ऐप में 5 स्तर: DPCC अध्यक्ष, महासचिव, ज़िला अध्यक्ष, विधानसभा ऑब्ज़र्वर और वार्ड सदस्य
            - नए अंक: हर शेयर 100 (हर प्लेटफ़ॉर्म), हर पूरा टास्क 100 (2 फोटो + 2 वीडियो), मंज़ूर अपना टास्क 100
            - मेरी रैंकिंग: वार्ड, विधानसभा, ज़िला और दिल्ली में (बिना नाम)
            - मेन्यू में: पोस्टर और बैनर, मेरा इनबॉक्स, अपना टास्क जोड़ें, अध्यक्ष जी को संदेश
            - प्रोफ़ाइल में जन्म तिथि, लिंग, वैवाहिक स्थिति और सोशल मीडिया लिंक
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
