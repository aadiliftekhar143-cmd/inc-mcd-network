# Optional: builds the APK on GitHub. Add repo secrets WS_API_URL and WS_ANON_KEY,
# Runs on every push to main that changes android/ or this file.
# then Actions > Build APK > Run workflow. Download the APK from the run's Artifacts.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Read app version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build Release APK
        env:
          WS_API_URL: ${{ secrets.WS_API_URL }}
          WS_ANON_KEY: ${{ secrets.WS_ANON_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
        run: |
          ARGS=""
          if [ -n "$WS_API_URL" ]; then ARGS="$ARGS -PWS_API_URL=$WS_API_URL -PWS_ANON_KEY=$WS_ANON_KEY"; fi
          if [ -n "$FCM_APP_ID" ]; then ARGS="$ARGS -PFCM_APP_ID=$FCM_APP_ID -PFCM_API_KEY=$FCM_API_KEY -PFCM_PROJECT_ID=$FCM_PROJECT_ID -PFCM_SENDER_ID=$FCM_SENDER_ID"; fi
          gradle assembleRelease bundleRelease $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: inc-mcd-network-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "INC MCD NETWORK v${{ steps.ver.outputs.name }}"
          make_latest: true
          body: |
            ### INC MCD NETWORK v${{ steps.ver.outputs.name }} (Build ${{ steps.ver.outputs.code }})
            - नए स्तर: ज़िला कोऑर्डिनेटर (महासचिव को रिपोर्ट) और ब्लॉक अध्यक्ष (वार्ड सदस्य की तरह टास्क और अंक)
            - सोशल मीडिया शेयर अब एक एक करके: X, फिर Facebook, फिर Instagram, और क्या बाकी है यह साफ़ दिखता है
            - अध्यक्ष जी के टास्क हर स्तर पर बड़े अक्षरों में अलग दिखते हैं
            - ऑब्ज़र्वर: विज़िट रिपोर्ट में वार्ड और काम चुनें, फोटो वीडियो चुनते ही अपलोड; हर सदस्य पर महीने का फ़ीडबैक
            - अध्यक्ष: लोगों के संदेश हफ़्ते के हिसाब से, ब्लॉक का प्रदर्शन, नाम और फोटो बदलना
            - सभी पदाधिकारी अपनी प्रोफ़ाइल एडिट कर सकते हैं; इनबॉक्स का लाल निशान पढ़ते ही हटता है
            - नया फ़ॉन्ट, मेन्यू से प्रोफ़ाइल बदलना, मेन्यू के नीचे Privacy Policy का लिंक
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
