# Optional: builds the APK on GitHub. Add repo secrets WS_API_URL and WS_ANON_KEY,
# then Actions > Build APK > Run workflow. Download the APK from the run's Artifacts.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build Release APK
        run: |
          if [ -n "${{ secrets.WS_API_URL }}" ]; then
            gradle assembleRelease -PWS_API_URL="${{ secrets.WS_API_URL }}" -PWS_ANON_KEY="${{ secrets.WS_ANON_KEY }}"
          else
            gradle assembleRelease
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ward-sadasya-apk, path: android/app/build/outputs/apk/release/*.apk }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: "MCD Election 2027 - ACTION APP v1.2"
          body: |
            ### MCD Election 2027 - ACTION APP v1.2 (Build 3)
            - 🔔 टॉप नोटिफिकेशन सेंटर (Notification Bell Icon & Screen)
            - 🚀 In-App Auto Update Alert सिस्टम
            - ✨ पॉइंट्स सिस्टम (Points System & Rankings)
            - ⭐ 5-स्टार परफॉर्मेंस रेटिंग्स
            - ⚡ तेज़ वीडियो अपलोड और रीट्राय फिक्स
            - 🎉 वीडियो सबमिट पर सेलिब्रेशन पॉपअप व ऑटो-होम रिटर्न
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
