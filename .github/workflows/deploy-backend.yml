# Deploys the Supabase backend: runs supabase/schema.sql and deploys the Edge Functions.
# One-time setup: add the repo secret SUPABASE_ACCESS_TOKEN
#   (Supabase > avatar > Account preferences > Access Tokens > Generate new token).
# The project is taken from the existing WS_API_URL secret (https://<project-ref>.supabase.co/...).
# Runs on every push to main that changes supabase/, or by hand from Actions > Deploy backend > Run workflow.
name: Deploy backend
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WS_API_URL: ${{ secrets.WS_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not configured in repository secrets. Skipping automated backend deploy."
            exit 0
          fi
          REF=$(echo "$WS_API_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$REF" ] || [ "$REF" = "$WS_API_URL" ]; then
            echo "::notice::Could not read the project ref from the WS_API_URL secret. Skipping."
            exit 0
          fi
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "SHOULD_DEPLOY=true" >> "$GITHUB_ENV"

      - name: Run the database script
        if: env.SHOULD_DEPLOY == 'true'
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > /tmp/query.json
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/query.json)
          head -c 3000 /tmp/out.json; echo
          echo "HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - uses: supabase/setup-cli@v1
        if: env.SHOULD_DEPLOY == 'true'
        with: { version: latest }

      - name: Deploy the Edge Functions
        if: env.SHOULD_DEPLOY == 'true'
        run: |
          supabase functions deploy app --project-ref "$REF" --no-verify-jwt
          supabase functions deploy leader --project-ref "$REF" --no-verify-jwt
          supabase functions deploy push --project-ref "$REF"
          supabase functions deploy admin --project-ref "$REF"
